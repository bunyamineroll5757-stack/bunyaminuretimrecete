<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bünyamin Reçete Sistemi</title>

<link rel="stylesheet" href="css/style.css">

<style>

/* ===============================
   ÜRETİM AYARLARI
================================ */

.ayarlar-panel {
    margin-top: 25px;
    padding: 15px;
    border-radius: 12px;
    background: #f5f7fa;
    border: 1px solid #ddd;
}

.ayarlar-panel > h2 {
    text-align: center;
    margin-bottom: 20px;
}

.ayar-grup {
    margin-bottom: 20px;
    background: white;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #ddd;
}

.ayar-grup h3 {
    margin: -12px -12px 12px -12px;
    padding: 10px;
    text-align: center;
    background: #ffe600;
    border-radius: 10px 10px 0 0;
    font-size: 17px;
}

.ayar-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
}

.ayar-grid input {
    width: 100%;
    box-sizing: border-box;
    padding: 11px;
    border: 1px solid #ccc;
    border-radius: 7px;
    font-size: 15px;
}

@media (max-width: 600px) {

    .ayar-grid {
        grid-template-columns: 1fr;
    }

    .ayarlar-panel {
        padding: 10px;
    }

    .ayar-grup {
        padding: 10px;
    }

    .ayar-grup h3 {
        margin: -10px -10px 10px -10px;
    }

}

</style>

</head>


<body>

<div class="container">

    <h1>Üretim Reçete Sistemi</h1>


    <div class="ust-panel">

        <button type="button" id="yeniReceteBtn">
            + Yeni Reçete
        </button>

        <div class="recete-sayisi">
            Toplam Reçete:
            <strong id="toplamRecete">0</strong>
        </div>

    </div>


    <!-- ===============================
         TEMEL REÇETE BİLGİLERİ
    ================================ -->

    <div class="form">

        <input id="recete_no" placeholder="Reçete No">

        <input id="urun_adi" placeholder="Ürün Adı">

        <input id="makine_adi" placeholder="Makine Adı">

        <input id="hiz" placeholder="Hız">

        <input id="sicaklik" placeholder="Sıcaklık">

        <input id="basinc" placeholder="Basınç">

        <textarea id="notlar" placeholder="Notlar"></textarea>


        <button type="button" id="kaydetBtn" onclick="kaydet()">
            Kaydet
        </button>

        <button type="button" id="btnTemizle" onclick="temizle()">
            Temizle
        </button>

    </div>


    <!-- ===============================
         ÜRETİM AYARLARI
    ================================ -->

    <div class="ayarlar-panel">

        <!-- GENEL AYARLAR -->

        <div class="ayar-grup">

            <h3>Genel Ayarlar</h3>

            <div class="ayar-grid">

                <input id="ayar_gram" placeholder="Gram">

                <input id="ayar_renk" placeholder="Renk">

                <input id="ayar_tarih" type="date">

                <input id="ayar_servolap" placeholder="Servolap">

                <input id="ayar_tarak_hizi" placeholder="Tarak Hızı">

                <input id="ayar_firma_adi" placeholder="Firma Adı">

            </div>

        </div>


        <!-- TARAK AYARLARI -->

        <div class="ayar-grup">

            <h3>Tarak Ayarları</h3>

            <div class="ayar-grid">

                <input id="ayar_ana_tambur" placeholder="Ana Tambur">

                <input id="ayar_alt_ara_dofer" placeholder="Alt Ara Dofer">

                <input id="ayar_siyirici" placeholder="Sıyırıcı">

                <input id="ayar_ust_ara_dofer" placeholder="Üst Ara Dofer">

                <input id="ayar_isci" placeholder="İşçi">

                <input id="ayar_ust_sevk_doferi" placeholder="Üst Sevk Doferi">

                <input id="ayar_alt_sevk_doferi" placeholder="Alt Sevk Doferi">

                <input id="ayar_ust_dofer_alici" placeholder="Üst Dofer Alıcı">

                <input id="ayar_alt_dofer_alici" placeholder="Alt Dofer Alıcı">

                <input id="ayar_ust_sevk_bandi" placeholder="Üst Sevk Bandı">

                <input id="ayar_alt_sevk_bandi" placeholder="Alt Sevk Bandı">

            </div>

        </div>


        <!-- SERİCİ AYARLARI -->

        <div class="ayar-grup">

            <h3>Serici Ayarları</h3>

            <div class="ayar-grid">

                <input id="ayar_tulbent_kati" placeholder="Tülbent Katı">

                <input id="ayar_besleme_cekim" placeholder="Besleme Çekim">

                <input id="ayar_serme_eni_on" placeholder="Serme Eni Ön">

                <input id="ayar_bant_cekim" placeholder="Bant Çekim">

                <input id="ayar_serme_eni_arka" placeholder="Serme Eni Arka">

                <input id="ayar_araba_cekim" placeholder="Araba Çekim">

                <input id="ayar_cikis_yuksekligi_sag" placeholder="Çıkış Yüksekliği Sağ">

                <input id="ayar_cikis_hafiza" placeholder="Çıkış Hafıza Faktörü">

                <input id="ayar_on_cikis_hafiza" placeholder="Ön Çıkış Hafıza Faktörü">

                <input id="ayar_cikis_yuksekligi_sol" placeholder="Çıkış Yüksekliği Sol">

                <input id="ayar_arka_cikis_hafiza" placeholder="Arka Çıkış Hafıza Faktörü">

            </div>

        </div>


        <!-- ÇEKTİRME AYARLARI -->

        <div class="ayar-grup">

            <h3>Çektirme Ayarları</h3>

            <div class="ayar-grid">

                <input id="ayar_trio1" placeholder="Trio 1 Çekim">

                <input id="ayar_trio2" placeholder="Trio 2 Çekim">

                <input id="ayar_trio3" placeholder="Trio 3 Çekim">

                <input id="ayar_trio4" placeholder="Trio 4 Ç
