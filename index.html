<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Üretim Reçete Yönetim Sistemi</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background-color: #f9f9f9; }
        .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        input { padding: 10px; width: 100%; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: #333; color: white; }
        button { padding: 10px 15px; cursor: pointer; background-color: #28a745; color: white; border: none; border-radius: 4px; margin-right: 5px; }
        button:hover { background-color: #218838; }
        .sil-btn { background-color: #dc3545; }
        .sil-btn:hover { background-color: #c82333; }
    </style>
</head>
<body>

<div class="container">
    <h1>Üretim Reçete Sistemi</h1>

    <div class="form-container">
        <div class="form-group">
            <label>Reçete No:</label>
            <input type="text" id="recete_no" readonly>
        </div>
        <div class="form-group">
            <label>Ürün Adı:</label>
            <input type="text" id="urun_adi" placeholder="Ürün adını giriniz">
        </div>
        <button id="kaydetBtn">Kaydet</button>
        <button id="yeniReceteBtn" style="background-color:#007bff;">Yeni Reçete</button>
    </div>

    <hr>

    <div style="margin-top:20px;">
        <input type="text" id="arama" placeholder="Reçete veya Ürün Ara...">
    </div>

    <h3>Kayıtlı Reçeteler (Toplam: <span id="toplamRecete">0</span>)</h3>
    <table>
        <thead>
            <tr>
                <th>No</th>
                <th>Ürün</th>
                <th>Tarih</th>
                <th>İşlemler</th>
            </tr>
        </thead>
        <tbody id="liste">
        </tbody>
    </table>
</div>

<script src="js/Script.js"></script>
</body>
</html>
